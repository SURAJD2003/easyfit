name: easyfit_clinics
description: EasyFit Clinics — Premium Fitness Tracking App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  provider: ^6.1.2
  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0

  # Local Storage
  shared_preferences: ^2.5.5

  # Sensors & Tracking
  pedometer: ^4.2.0
  sensors_plus: ^7.0.0
  geolocator: ^13.0.4
  google_maps_flutter: ^2.16.0
  flutter_polyline_points: ^2.1.0

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  firebase_messaging: ^15.2.10
  google_sign_in: ^6.3.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Payments
  in_app_purchase: ^3.2.3

  # Charts
  fl_chart: ^0.69.2

  # UI / Animations
  flutter_animate: ^4.5.2
  lottie: ^3.3.2
  flutter_svg: ^2.2.4
  iconsax: ^0.0.8
  phosphor_flutter: ^2.1.0
  google_fonts: ^6.3.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  connectivity_plus: ^6.1.5
  permission_handler: ^11.4.0
  package_info_plus: ^8.3.1
  url_launcher: ^6.3.2

  # Code Gen (runtime)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_background_service: ^5.1.0
  pdf: ^3.12.0
  share_plus: ^12.0.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generators
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.4
  freezed: ^2.5.8
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/